apiVersion: apps/v1
kind: Deployment
metadata:
  name: ti-web
  namespace: transcript-intelligence
  labels: {app: ti-web}
spec:
  replicas: 1          # keep at 1: conversations are held in memory and the app answers one question at a time
  selector:
    matchLabels: {app: ti-web}
  template:
    metadata:
      labels: {app: ti-web}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: ti-web:local
          imagePullPolicy: IfNotPresent     # local clusters use the image you built; change this when you push to a registry
          ports:
            - name: http
              containerPort: 8000
          env:
            - {name: HOME, value: /tmp}      # the root filesystem is read-only; libraries that cache under HOME use /tmp
          envFrom:
            - configMapRef: {name: ti-config}
            - secretRef: {name: ti-secrets}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
