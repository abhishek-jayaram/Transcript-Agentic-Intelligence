# TEMPLATE ONLY - do not put real values in a file you commit or share.
# Create the real secret from your terminal instead (see DEPLOY.md step 6):
#   kubectl -n transcript-intelligence create secret generic ti-secrets --from-env-file=k8s/secrets.env
# where k8s/secrets.env (git-ignored, never shared) has one KEY=value per line for the keys below.
apiVersion: v1
kind: Secret
metadata:
  name: ti-secrets
  namespace: transcript-intelligence
type: Opaque
stringData:
  NEO4J_PASSWORD: "<neo4j password>"
  AZURE_TENANT_ID: "<service principal tenant>"
  AZURE_CLIENT_ID: "<service principal appId>"
  AZURE_CLIENT_SECRET: "<service principal password>"
  APPLICATIONINSIGHTS_CONNECTION_STRING: ""   # optional; leave empty to run without telemetry
